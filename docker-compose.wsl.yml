services:
  frontend:
    build:
      context: ${FRONTEND_DIR:-../gugnir v2}
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
      args:
        BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:4000/api}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/realtime}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: gungnir-frontend
    restart: unless-stopped
    env_file:
      - .env.wsl
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gungnir-backend
    restart: unless-stopped
    env_file:
      - .env.wsl
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    command: >-
      sh -c "node docker/wait-for-postgres.js &&
      npm run db:migrate &&
      npm run db:seed &&
      node dist/main.js"

  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: gungnir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gungnir
      POSTGRES_USER: gungnir
      POSTGRES_PASSWORD: gungnir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gungnir -d gungnir"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: gungnir-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gungnir-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1884}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
