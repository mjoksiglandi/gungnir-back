services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gungnir-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://gungnir:gungnir@postgres:5432/gungnir
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      GUARDIAN_E2E_KEY_HEX: cf0ce2085baa4326de1ce3fa470e92959607261d896903d15d1ff60ab748cc14
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    command: >-
      node dist/main.js

  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: gungnir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gungnir
      POSTGRES_USER: gungnir
      POSTGRES_PASSWORD: gungnir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gungnir -d gungnir"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: gungnir-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gungnir-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1884}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  nats:
    image: nats:2.11-alpine
    container_name: gungnir-nats
    ports:
      - "4222:4222"
    profiles: ["optional"]

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
