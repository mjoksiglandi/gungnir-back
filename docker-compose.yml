services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gungnir-backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://gungnir:gungnir@postgres:5432/gungnir}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm run db:migrate && pnpm run db:seed && pnpm run start:dev"

  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: gungnir-postgres
    environment:
      POSTGRES_DB: gungnir
      POSTGRES_USER: gungnir
      POSTGRES_PASSWORD: gungnir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gungnir -d gungnir"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: gungnir-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gungnir-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  nats:
    image: nats:2.11-alpine
    container_name: gungnir-nats
    ports:
      - "4222:4222"
    profiles: ["optional"]

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
